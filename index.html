<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/index.css" rel="stylesheet" />
    <script>
      // Resolve theme before first paint to avoid flash.
      // Priority: ?theme=light|dark URL param → system preference.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var override = params.get("theme");
          var resolved =
            override === "light" || override === "dark"
              ? override
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.classList.toggle(
            "dark",
            resolved === "dark",
          );
        } catch (_) {}
      })();
    </script>

    <!-- Tracking files come from here. They are not preloaded: on a slow link a
         multi-megabyte preload competes with the scripts the first paint needs. -->
    <link rel="preconnect" href="https://cdn.vincentt.studio" crossorigin />

    <!-- Title, description and share image: edit app.config.json, not this file.
         This file is replaced by a template upgrade; app.config.json is yours and
         scripts/build.mjs + scripts/dev.mjs (via scripts/app-metadata.mjs) write
         its values into these tags. A project upgraded from a template without
         those scripts must copy them first (see MIGRATION.md). -->
